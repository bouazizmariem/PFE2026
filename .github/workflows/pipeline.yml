name: Ecommerce scraping pipeline

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      # ── 1. Récupérer le code ──────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. Upgrade dépendances critiques ─────────────────
      # FIX : scrapy ajouté ici pour être disponible avant tout import
      - name: Upgrade core dependencies
        run: pip install --upgrade scrapy pymongo certifi dnspython beautifulsoup4 requests

      # ── 4. Chrome + ChromeDriver ─────────────────────────
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Upgrade Selenium
        run: pip install --upgrade selenium

      # ── 5. Dépendances Python ────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 6. Vérification SSL ───────────────────────────────
      - name: Check OpenSSL version
        run: python -c "import ssl; print(ssl.OPENSSL_VERSION)"

      # ── 7. Créer les dossiers de données ─────────────────
      - name: Create data folders
        run: mkdir -p data_raw data_clean

      # ════════════════════════════════════════════════════
      # SCRAPING
      # ════════════════════════════════════════════════════

     
      - name: Scrape Spacenet Electromenager
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'data_scraping')
          import spacenetelecProd_spider as s
          s.run(output_file='data_raw/spacenet_products.json')
          "

      - name: Scrape Spacenet Informatique
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'data_scraping')
          import spacenetInfoProd_spider as s
          s.run(output_file='data_raw/spacenet_Infoproducts.json')
          "

      - name: Scrape Tunisianet Electromenager
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'data_scraping')
          import tunisianet_Electrospider as s
          s.run(output_file='data_raw/tunisianet_Electroproducts.json')
          "

      - name: Scrape Tunisianet Informatique
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'data_scraping')
          import tunisianet_Infospider as s
          s.run(output_file='data_raw/tunisianet_Infoproducts.json')
          "

      # ════════════════════════════════════════════════════
      # CLEANING
      # ════════════════════════════════════════════════════

      

      - name: Clean Spacenet and Tunisianet
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'data_cleaning')
          import cleanSpacenetTunisianet as c
          c.main(
              input_file='data_raw/spacenet_products.json',
              output_file='data_clean/clean_spacenetElectroproducts.json',
              site_name='spacenet'
          )
          c.main(
              input_file='data_raw/spacenet_Infoproducts.json',
              output_file='data_clean/clean_spacenetInfoproducts.json',
              site_name='spacenet'
          )
          c.main(
              input_file='data_raw/tunisianet_Electroproducts.json',
              output_file='data_clean/clean_TunisianetElectroproducts.json',
              site_name='tunisianet'
          )
          c.main(
              input_file='data_raw/tunisianet_Infoproducts.json',
              output_file='data_clean/clean_TunisianetInfoproducts.json',
              site_name='tunisianet'
          )
          "

      # ════════════════════════════════════════════════════
      # INGESTION MONGODB ATLAS
      # ════════════════════════════════════════════════════

      - name: Ingest to MongoDB Atlas
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DATA_FOLDER: data_clean
        run: python database.py