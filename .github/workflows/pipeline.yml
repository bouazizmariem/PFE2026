name: Ecommerce scraping pipeline

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: self-hosted
    timeout-minutes: 120
    env:
      PYTHONIOENCODING: utf-8

    steps:

      # ── 1. Checkout ───────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Python ─────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. Chrome + ChromeDriver ──────────────────────────
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # ── 4. All dependencies (one step, upgrade wins) ──────
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install --upgrade scrapy pymongo certifi dnspython beautifulsoup4 requests selenium

      # ── 5. SSL check ──────────────────────────────────────
      - name: Check OpenSSL version
        run: python -c "import ssl; print(ssl.OPENSSL_VERSION)"

      # ── 6. Create data folders ────────────────────────────
      - name: Create data folders
        run: python -c "import os; os.makedirs('data_raw', exist_ok=True); os.makedirs('data_clean', exist_ok=True)"

      # ══════════════════════════════════════════════════════
      # SCRAPING (continue-on-error so one failure doesn't kill the pipeline)
      # ══════════════════════════════════════════════════════
      - name: Scrape Mytek Electromenager
        continue-on-error: true
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'data_scraping')
          import mytek_elecscraper as s
          s.run(output_file='data_raw/mytek_Electroproducts.json')
          "

      - name: Scrape Mytek Informatique
        continue-on-error: true
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'data_scraping')
          import mytek_infoscraper as s
          s.run(output_file='data_raw/mytek_Infoproducts.json')
          "

      - name: Scrape Spacenet Electromenager
        continue-on-error: true
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'data_scraping')
          import spacenetelecProd_spider as s
          s.run(output_file='data_raw/spacenet_products.json')
          "

      - name: Scrape Spacenet Informatique
        continue-on-error: true
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'data_scraping')
          import spacenetInfoProd_spider as s
          s.run(output_file='data_raw/spacenet_Infoproducts.json')
          "

      - name: Scrape Tunisianet Electromenager
        continue-on-error: true
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'data_scraping')
          import tunisianet_Electrospider as s
          s.run(output_file='data_raw/tunisianet_Electroproducts.json')
          "

      - name: Scrape Tunisianet Informatique
        continue-on-error: true
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'data_scraping')
          import tunisianet_Infospider as s
          s.run(output_file='data_raw/tunisianet_Infoproducts.json')
          "

      # ══════════════════════════════════════════════════════
      # CLEANING (skips missing files gracefully)
      # ══════════════════════════════════════════════════════
      - name: Clean Mytek
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, 'data_cleaning')
          import cleanMytek as c
          pairs = [
              ('data_raw/mytek_Electroproducts.json', 'data_clean/clean_mytekElectroproducts.json'),
              ('data_raw/mytek_Infoproducts.json',    'data_clean/clean_mytekInfoproducts.json'),
          ]
          for inp, out in pairs:
              if os.path.exists(inp):
                  c.main(input_file=inp, output_file=out)
              else:
                  print(f'Skipping missing file: {inp}')
          "

      - name: Clean Spacenet and Tunisianet
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, 'data_cleaning')
          import cleanSpacenetTunisianet as c
          pairs = [
              ('data_raw/spacenet_products.json',         'data_clean/clean_spacenetElectroproducts.json',  'spacenet'),
              ('data_raw/spacenet_Infoproducts.json',     'data_clean/clean_spacenetInfoproducts.json',     'spacenet'),
              ('data_raw/tunisianet_Electroproducts.json','data_clean/clean_TunisianetElectroproducts.json','tunisianet'),
              ('data_raw/tunisianet_Infoproducts.json',   'data_clean/clean_TunisianetInfoproducts.json',   'tunisianet'),
          ]
          for inp, out, site in pairs:
              if os.path.exists(inp):
                  c.main(input_file=inp, output_file=out, site_name=site)
              else:
                  print(f'Skipping missing file: {inp}')
          "

      # ══════════════════════════════════════════════════════
      # MONGODB INGESTION
      # ══════════════════════════════════════════════════════
      - name: Ingest to MongoDB Atlas
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DATA_FOLDER: data_clean
        run: python database.py