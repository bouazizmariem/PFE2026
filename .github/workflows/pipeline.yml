name: Ecommerce scraping pipeline

on:
  schedule:
    - cron: "0 */12 * * *"   # toutes les 12h automatiquement
  workflow_dispatch:          # bouton Run manuel sur GitHub

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      # ── 1. Récupérer le code ──────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. Upgrade pymongo, certifi, dnspython ───────────
      - name: Upgrade pymongo and certifi
        run: pip install --upgrade pymongo certifi dnspython

      # ── 4. Chrome + ChromeDriver ─────────────────────────
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Upgrade Selenium
        run: pip install --upgrade selenium

      # ── 5. Dépendances Python ────────────────────────────
      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 6. Vérification SSL ───────────────────────────────
      - name: Check OpenSSL version
        run: python -c "import ssl; print(ssl.OPENSSL_VERSION)"

      # ── 7. Créer les dossiers de données ─────────────────
      - name: Create data folders
        run: mkdir -p data_raw data_clean

      # ════════════════════════════════════════════════════
      # DIAGNOSTIC CI — Vérifie que Mytek est accessible
      # et affiche quel sélecteur fonctionne sur Ubuntu CI
      # → Partager la sortie pour corriger les scrapers
      # → Supprimer ce step une fois les scrapers corrigés
      # ════════════════════════════════════════════════════

      - name: Diagnose Mytek on CI
        run: |
          python -c "
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          import time

          o = Options()
          o.add_argument('--headless=new')
          o.add_argument('--no-sandbox')
          o.add_argument('--disable-dev-shm-usage')
          o.add_argument('--disable-gpu')
          o.add_argument('--window-size=1920,1080')
          o.add_argument('--disable-blink-features=AutomationControlled')
          o.add_argument('--disable-software-rasterizer')
          o.add_argument('--ignore-certificate-errors')
          o.add_argument('--user-agent=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36')
          o.add_experimental_option('excludeSwitches', ['enable-automation'])
          o.add_experimental_option('useAutomationExtension', False)

          d = webdriver.Chrome(options=o)
          d.get('https://www.mytek.tn/electromenager.html')
          time.sleep(5)

          print('TITRE  :', d.title)
          print('URL    :', d.current_url)
          print('HTML[:800]:', d.page_source[:800])

          selectors = [
              'ul.list-unstyled li a',
              'div.category-description a',
              'div.sidebar a',
              'nav a',
              'ul.items li a',
              'ol.items li a',
              'div.block-content a',
              'a.level-top',
              'li.level1 a',
              'li.level2 a',
              'div.subcategories a',
              'div.categories-menu a',
          ]
          print()
          for sel in selectors:
              els = d.find_elements(By.CSS_SELECTOR, sel)
              links = [e.get_attribute('href') for e in els
                       if e.get_attribute('href')
                       and 'mytek.tn' in (e.get_attribute('href') or '')]
              print(f'[{sel}] -> {len(links)} liens')
              for l in links[:3]:
                  print(f'    {l}')

          d.quit()
          "

      # ════════════════════════════════════════════════════
      # SCRAPING
      # ════════════════════════════════════════════════════

      - name: Scrape Mytek Informatique
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'data_scraping')
          import mytek_infoscraper as s
          s.run(output_file='data_raw/mytek_infoproducts.json')
          "

      - name: Scrape Mytek Electromenager
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'data_scraping')
          import mytek_elecscraper as s
          s.run(output_file='data_raw/mytek_Electroproducts.json')
          "

      - name: Scrape Spacenet Electromenager
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'data_scraping')
          import spacenetelecProd_spider as s
          s.run(output_file='data_raw/spacenet_products.json')
          "

      - name: Scrape Spacenet Informatique
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'data_scraping')
          import spacenetInfoProd_spider as s
          s.run(output_file='data_raw/spacenet_Infoproducts.json')
          "

      - name: Scrape Tunisianet Electromenager
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'data_scraping')
          import tunisianet_Electrospider as s
          s.run(output_file='data_raw/tunisianet_Electroproducts.json')
          "

      - name: Scrape Tunisianet Informatique
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'data_scraping')
          import tunisianet_Infospider as s
          s.run(output_file='data_raw/tunisianet_Infoproducts.json')
          "

      # ════════════════════════════════════════════════════
      # CLEANING
      # ════════════════════════════════════════════════════

      - name: Clean Mytek
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'data_cleaning')
          import cleanMytek as c
          c.main(
              input_file='data_raw/mytek_Electroproducts.json',
              output_file='data_clean/clean_mytekElectproducts.json'
          )
          c.main(
              input_file='data_raw/mytek_infoproducts.json',
              output_file='data_clean/clean_mytek_Infoproducts.json'
          )
          "

      - name: Clean Spacenet and Tunisianet
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'data_cleaning')
          import cleanSpacenetTunisianet as c
          c.main(
              input_file='data_raw/spacenet_products.json',
              output_file='data_clean/clean_spacenetElectroproducts.json',
              site_name='spacenet'
          )
          c.main(
              input_file='data_raw/spacenet_Infoproducts.json',
              output_file='data_clean/clean_spacenetInfoproducts.json',
              site_name='spacenet'
          )
          c.main(
              input_file='data_raw/tunisianet_Electroproducts.json',
              output_file='data_clean/clean_TunisianetElectroproducts.json',
              site_name='tunisianet'
          )
          c.main(
              input_file='data_raw/tunisianet_Infoproducts.json',
              output_file='data_clean/clean_TunisianetInfoproducts.json',
              site_name='tunisianet'
          )
          "

      # ════════════════════════════════════════════════════
      # INGESTION MONGODB ATLAS
      # ════════════════════════════════════════════════════

      - name: Ingest to MongoDB Atlas
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          DATA_FOLDER: data_clean
        run: python database.py